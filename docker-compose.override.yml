# Development override for docker-compose.yml
# This file is automatically loaded by docker-compose when it exists
version: '3.8'

services:
  mlflow:
    environment:
      - MLFLOW_TRACKING_URI=http://localhost:5000
      - MLFLOW_SERVE_ARTIFACTS=true
      - MLFLOW_TRACKING_USERNAME=admin
      - MLFLOW_TRACKING_PASSWORD=admin
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri file:/app/mlruns
      --default-artifact-root file:/app/mlruns
      --serve-artifacts
      --workers 1

  streamlit:
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_LOGGER_LEVEL=debug
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./docs:/app/docs
      - ./mlruns:/app/mlruns
      - ./src:/app/src  # Mount source code for live reloading 